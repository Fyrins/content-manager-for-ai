name: Release
on:
  push:
    tags: ['v*']

jobs:
  # The installable zip and the GitHub release do not depend on WordPress.org:
  # while the plugin is not listed there, the SVN deploy fails, and it used to
  # take the release down with it.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check versions
        run: bin/check-versions.sh . "$GITHUB_REF_NAME"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      # `build/` is not versioned: the settings screen's script has to be built
      # before the package is assembled from the working tree.
      - name: Build the settings screen
        run: npm ci && npm run build
      # Same content as the WordPress.org package: the working tree minus
      # .distignore, in a folder named after the slug so that WordPress
      # installs it under the right directory.
      - name: Assemble the zip
        run: |
          mkdir -p dist/content-manager-for-ai-agents
          rsync -a --exclude-from=.distignore --exclude=dist ./ dist/content-manager-for-ai-agents/
          (cd dist && zip -qr content-manager-for-ai-agents.zip content-manager-for-ai-agents)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" dist/content-manager-for-ai-agents.zip --title "$VERSION" --notes-file notes.md

  # Off until the plugin is approved on WordPress.org: set the repository
  # variable DEPLOY_TO_WPORG to `true` to turn it on.
  wordpress-org:
    needs: release
    if: vars.DEPLOY_TO_WPORG == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Build the settings screen
        run: npm ci && npm run build
      - uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: content-manager-for-ai-agents
          ASSETS_DIR: .wordpress-org
